server.port=${PORT:8080}
spring.application.name=endangered-species-api

# -----------------------------
# Persistence (H2 file database)
# -----------------------------
# The default is a folder next to the jar; set APP_DB_PATH to a mounted volume to keep
# accounts and contact messages across restarts.
spring.datasource.url=jdbc:h2:file:${APP_DB_PATH:./data/speciesdb};DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# -----------------------------
# Uploads
# -----------------------------
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# -----------------------------
# Application settings
# -----------------------------
app.cors.allowed-origin=${CLIENT_ORIGIN:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}
app.jwt.expiration-hours=24
app.wiki.timeout-ms=3000

# Machine-learning models live outside the jar; run scripts/fetch-models.ps1 to install them
app.ml.model-dir=${ML_MODEL_DIR:models}
app.ml.image-model=mobilenetv2-12.onnx
app.ml.image-labels=imagenet-synset.txt
app.ml.audio-model=yamnet.onnx

# CLIP turns identification into open-vocabulary matching against the catalogue itself
app.ml.clip-dir=clip
app.ml.clip-vision-model=vision_model.onnx
app.ml.clip-text-model=text_model.onnx
app.ml.clip-vocab=vocab.json
app.ml.clip-merges=merges.txt

# Cache of the 141 catalogue species encoded as CLIP text (rebuilt when the data changes)
app.ml.species-cache=data/species-embeddings.json

# Omit null fields so optional response keys (e.g. "image") disappear like they did before
spring.jackson.default-property-inclusion=non_null
